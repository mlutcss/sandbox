name: Lint

on:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/'
      - 'vite.config.js'
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  lint:
    name: Check that lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
